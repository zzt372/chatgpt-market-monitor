name: Monitor - FlexiSpot E7 Pro Verified SKU Price

on:
  push:
    branches: [main]
    paths:
      - "monitors/flexispot-e7pro/*.mjs"
      - ".github/workflows/flexispot-e7pro.yml"
  workflow_dispatch:
  schedule:
    # Two staggered opportunities/hour; GitHub schedule can be delayed or dropped.
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: flexispot-e7pro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Verify official E7 Pro white and black SKU prices in browser
        id: verify
        shell: bash
        run: |
          set +e
          node monitors/flexispot-e7pro/check.mjs
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit verified price data or diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitors/flexispot-e7pro/diagnostic.json
          git add monitors/flexispot-e7pro/latest.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update FlexiSpot E7 Pro SKU price"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
      - name: Flag verification failure
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
