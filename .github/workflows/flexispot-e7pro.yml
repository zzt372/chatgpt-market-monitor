name: Monitor - FlexiSpot E7 Pro Verified SKU Price

on:
  push:
    branches: [main]
    paths:
      - "monitors/flexispot-e7pro/*.mjs"
      - ".github/workflows/flexispot-e7pro.yml"
  workflow_dispatch:
  schedule:
    # Two staggered opportunities/hour; GitHub schedule can be delayed or dropped.
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: flexispot-e7pro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Verify official E7 Pro white and black SKU prices in browser
        id: verify
        shell: bash
        run: |
          set +e
          node monitors/flexispot-e7pro/check.mjs
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish newer verified data safely (concurrent writer resistant)
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve this run's outputs before resetting to the latest remote main.
          result_dir="$(mktemp -d)"
          cp monitors/flexispot-e7pro/diagnostic.json "$result_dir/diagnostic.json"
          if [[ "$VERIFY_EXIT_CODE" == "0" ]]; then
            cp monitors/flexispot-e7pro/latest.json "$result_dir/latest.json"
          fi

          # Other hourly GitHub Actions also push to main. Never rebase generated
          # JSON over generated JSON: restart from the remote head on each retry.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            node - "$result_dir" "$VERIFY_EXIT_CODE" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [dir, status] = process.argv.slice(2);
          const root = "monitors/flexispot-e7pro";
          function useIfNewer(filename) {
            const incomingPath = path.join(dir, filename);
            const incoming = JSON.parse(fs.readFileSync(incomingPath, "utf8"));
            const timestamp = Date.parse(incoming.checked_at);
            if (!Number.isFinite(timestamp)) throw new Error("Invalid incoming timestamp: " + filename);
            const destPath = path.join(root, filename);
            let existingTimestamp = -Infinity;
            try {
              const existing = JSON.parse(fs.readFileSync(destPath, "utf8"));
              existingTimestamp = Date.parse(existing.checked_at);
            } catch (e) {
              if (e.code !== "ENOENT") {
                console.warn("Existing " + filename + " is invalid; replacing with verified output.");
              }
            }
            if (Number.isFinite(existingTimestamp) && timestamp <= existingTimestamp) {
              console.log("Preserving newer remote " + filename);
              return;
            }
            fs.copyFileSync(incomingPath, destPath);
            console.log("Staged fresh " + filename + " checked at " + incoming.checked_at);
          }
          useIfNewer("diagnostic.json");
          if (status === "0") useIfNewer("latest.json");
          NODE
            git add monitors/flexispot-e7pro/diagnostic.json monitors/flexispot-e7pro/latest.json
            if git diff --cached --quiet; then
              echo "Remote already has the same or newer verified data."
              exit 0
            fi
            git commit -m "Update FlexiSpot E7 Pro SKU price"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Failed to publish verified data after six merge-free attempts." >&2
          exit 1
      - name: Flag verification failure
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
