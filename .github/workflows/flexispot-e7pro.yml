name: Monitor - FlexiSpot E7 Pro Official SKU Price

on:
  push:
    branches: [main]
    paths:
      - "monitors/flexispot-e7pro/*.mjs"
      - ".github/workflows/flexispot-e7pro.yml"
  workflow_dispatch:
  schedule:
    - cron: "31 * * * *"

permissions:
  contents: write

concurrency:
  group: flexispot-e7pro-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify official E7 Pro white and black SKU prices
        run: node monitors/flexispot-e7pro/check-api.mjs
      - name: Commit verified price data or diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitors/flexispot-e7pro/diagnostic.json
          git add monitors/flexispot-e7pro/latest.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update FlexiSpot E7 Pro SKU price"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
