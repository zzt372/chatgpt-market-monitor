name: Validation - Forward P/E concurrent publisher
on:
  push:
    branches: ['fix/forward-pe-concurrent-push-20261012']
    paths:
      - '.github/workflows/forward-pe-publish-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile producer and publisher
        working-directory: monitors/nasdaq-forward-pe
        run: python -m compileall -q fetch.py direct_source.py publish.py test_fetch.py test_direct_source.py test_publish.py
      - name: Full unit and regression tests
        working-directory: monitors/nasdaq-forward-pe
        run: python -m unittest -v test_fetch.py test_direct_source.py test_publish.py
