name: Market Monitor - SOX Drawdown

on:
  push:
    branches: [main]
    paths:
      - "monitors/sox-drawdown/drawdown.py"
      - "monitors/test_index_drawdown.py"
      - "monitors/index_drawdown.py"
      - "monitors/market-alerts/**"
      - ".github/workflows/sox-drawdown.yml"
  workflow_dispatch:
  schedule:
    # Redundant off-peak triggers: scheduled GitHub events can be delayed or dropped.
    - cron: "2,22,42 * * * *"

permissions:
  contents: write

concurrency:
  group: sox-drawdown-update
  cancel-in-progress: false

jobs:
  update:
    defaults:
      run:
        working-directory: monitors/sox-drawdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run drawdown tests
        working-directory: .
        run: |
          python -m unittest discover -s monitors -p test_index_drawdown.py -v
          python -m unittest discover -s monitors/market-alerts -p test_alerts.py -v
      - name: Fetch complete SOX close history from official Nasdaq API
        run: python drawdown.py
      - name: Validate drawdown payload
        run: python drawdown.py --check-latest --max-fetch-age-seconds 120
      - name: Commit drawdown.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drawdown.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update SOX drawdown"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
